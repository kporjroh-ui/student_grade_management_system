<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Student View</title>
        <link rel="stylesheet" href="/css/bootstrap.min.css" />
        <link rel="stylesheet" href="/css/main.css" />
        <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" type="text/css" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    </head>
    <body>
        <div class="app">
            <div th:replace="~{fragments/header :: header}"></div>

            <div class="main container-fluid">
                <!--Student Info-->
                <div class="row mt-4">
                    <div class="col-6">
                        <div class="card mb-3" style="max-width: 540px;">
                            <div class="row g-0">
                                <div class="col-md-4">
                                    <img src="/images/imagedummy.jpg" class="img-fluid rounded-start" alt="...">
                                </div>
                                <div class="col-md-8">
                                    <div class="card-body">
                                        <h5 class="card-title" th:text="|${student.firstName} ${student.lastName}|">Student Name</h5>
                                        <ul class="list-group list-group-flush">
                                            <li class="list-group-item" th:text="${student.studentID}">Student ID: 123456789</li>
                                            <li class="list-group-item" th:text="${student.email}">Email: </li>
                                            <li class="list-group-item" th:text="${student.phoneNumber}">Phone: 123-456-7890</li>
                                            <li class="list-group-item">Enrollment Date: 00/00/0000</li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="card" style="width: 18rem;">
                            <ul class="list-group list-group-flush">
                                <li class="list-group-item">Program: <b>Computer science</b></li>
                                <li class="list-group-item">Year: <b>Sophomore</b></li>
                                <li class="list-group-item">Major: <b>Computer Science</b></li>
                                <li class="list-group-item">Status: <b>Fully Active</b></li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <a class="btn btn-primary btn-lg mb-4" th:href="@{/enrollments/{studentID}/new(studentID=${student.studentID})}">Enroll</a>
                    <table class="table table-striped-columns table-responsive">
                        <thead>
                        <tr>
                            <th scope="col">Course Code</th>
                            <th scope="col">Course Name</th>
                            <th scope="col">Credit Hours</th>
                            <th scope="col">Instructor</th>
                            <th scope="col">Status</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr>
                            <td>data</td>
                            <td>data</td>
                            <td>data</td>
                            <td>data</td>
                            <td>data</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </body>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</html>
