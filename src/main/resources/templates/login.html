<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Login - Student grade Manager</title>
        <link rel="stylesheet" th:href="@{/css/bootstrap.css}">
        <link rel="stylesheet" th:href="@{/css/main.css}">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    </head>

    <body>
    <div class="app">
        <div class="main container-fluid">
            <div class="row">
                <!--Image-->
                <div class="col-6">
                    <img src="images/sgm1.jpg" alt="">
                    <h1>Student Grade Manager</h1>
                    <p>Track &nbsp;•&nbsp; Manage &nbsp;•&nbsp; Succeed</p>
                </div>

                <!--Login Form-->
                <div class="col-6">
                    <form th:action="@{/login}" method="post">
                        <h2 class="text-center">Welcome Back</h2>
                        <p class="sub text-center">Sign in to your account</p>
                        <div class="form-floating mb-5 mt-5">
                            <label for="roleSelect" class="form-label">Select Role</label>
                            <select class="form-control" id="roleSelect">
                                <option value="1">Admin</option>
                                <option value="2">Teacher</option>
                                <option value="3">User</option>
                            </select>
                        </div>
                        <div class="form-floating mb-5 mt-5">
                            <label class="form-label" for="username">Username:</label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required>
                        </div>
                        <div class="form-floating mb-5 mt-5">
                            <label class="form-label" for="password">Password:</label>
                            <input type="password" id="password" class="form-control" name="password" placeholder="Enter your password" required>
                        </div>
                        <div class="row-between">
                           <label><input type="checkbox" name="remember-me" checked> Remember me</label>
                           <a href="#" class="text-end">Forgot password?</a>
                        </div>
                        <div class="d-grid gap-2 md:d-block">
                            <button type="submit" class="btn-solid theme-primary">Sign In</button>
                        </div>
                            <p class="text-center">Don't have an account? Contact your administrator.</p>
                    </form>
                </div>

            </div>
        </div>
    </div>

    </div>
    </body>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
